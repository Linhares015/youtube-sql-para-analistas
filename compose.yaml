services:
  postgres:
    image: postgres:17-alpine
    container_name: youtube-sql-para-analistas
    environment:
      POSTGRES_DB: vendas
      POSTGRES_USER: analista
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/project/sql:ro
      - ./sql/setup.sql:/docker-entrypoint-initdb.d/00-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analista -d vendas"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
